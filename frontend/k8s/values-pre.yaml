# Único entorno: Jenkins (DEPLOY_PRE) hace CI y helm upgrade con este fichero.
namespace: verbaflow
replicaCount: 1
registry: ghcr.io/juanfranvelilla/verbaflow-frontend
image:
  tag: ""
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
extraEnv:
  - name: "TZ"
    value: "UTC"
extraEnvFrom: []
resources:
  requests:
    memory: "64Mi"
    cpu: 100m
  limits:
    memory: "256Mi"
    cpu: 500m
volumes:
  - name: tmpfs-var-lib-nginx-tmp
    emptyDir:
      medium: Memory
  - name: tmpfs-run-nginx
    emptyDir:
      medium: Memory
volumeMounts:
  - name: tmpfs-var-lib-nginx-tmp
    mountPath: /var/lib/nginx/tmp
  - name: tmpfs-run-nginx
    mountPath: /run/nginx
ingress:
  enabled: false
gatewayRoute:
  enabled: true
  host: "verbaflow.juanfranciscoperez.es"
  path: "/"
gateway:
  enabled: true
  name: lab
  namespace: jenkins
  sectionName: https-verbaflow
  issuer: letsencrypt-ovh-prod
  tlsSecret: verbaflow-gateway-tls